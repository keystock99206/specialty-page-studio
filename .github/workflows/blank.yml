name: MOS-PAF CI

on:
  push:
    branches:
      - main
      - mos-paf/runtime-lock-ci
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    name: Deterministic dependency lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v1.46.3
      - name: Generate authoritative Deno lock
        run: deno cache --lock=deno.lock --lock-write npm:@base44/sdk@0.8.40
      - name: Commit generated lock on engineering branch
        if: github.event_name == 'push' && github.ref_name == 'mos-paf/runtime-lock-ci'
        run: |
          if git diff --quiet -- deno.lock && git ls-files --error-unmatch deno.lock >/dev/null 2>&1; then
            echo 'deno.lock already deterministic'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deno.lock
          git commit -m 'build: commit deterministic Deno dependency lock'
          git push
      - name: Require committed deterministic lock
        if: github.ref_name != 'mos-paf/runtime-lock-ci' || github.event_name != 'push'
        run: git diff --exit-code -- deno.lock && git ls-files --error-unmatch deno.lock

  verify:
    name: Check / lint / test
    needs: lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v1.46.3
      - name: Type and import graph check
        run: deno task check
      - name: Lint
        run: deno task lint
      - name: Test
        run: deno task test
