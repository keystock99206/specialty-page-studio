name: MOS-PAF CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    name: Deterministic dependency lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v1.46.3
      - name: Generate authoritative Deno lock
        run: deno cache --lock=deno.lock --lock-write npm:@base44/sdk@0.8.40
      - name: Commit generated lock on engineering branch
        if: github.event_name == 'push' && github.ref_name == 'mos-paf/runtime-lock-ci'
        run: |
          if git diff --quiet -- deno.lock && git ls-files --error-unmatch deno.lock >/dev/null 2>&1; then
            echo 'deno.lock already deterministic'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deno.lock
          git commit -m 'build: commit deterministic Deno dependency lock'
          git push
      - name: Require committed deterministic lock
        if: github.ref_name != 'mos-paf/runtime-lock-ci' || github.event_name != 'push'
        run: git diff --exit-code -- deno.lock && git ls-files --error-unmatch deno.lock

  verify:
    name: Check / lint / test
    needs: lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v1.46.3
      - name: Source integrity — enumerate missing local imports
        shell: bash
        run: |
          set -euo pipefail
          missing_file="$(mktemp)"
          while IFS= read -r source; do
            while IFS= read -r spec; do
              [[ "$spec" == ./* || "$spec" == ../* ]] || continue
              candidate="$(dirname "$source")/$spec"
              if [[ -f "$candidate" ]]; then
                continue
              fi
              if [[ -f "${candidate}.ts" || -f "${candidate}.tsx" || -f "${candidate}.js" || -f "${candidate}.mjs" || -f "${candidate}/index.ts" || -f "${candidate}/index.tsx" || -f "${candidate}/index.js" ]]; then
                continue
              fi
              printf '%s -> %s\n' "$source" "$spec" >> "$missing_file"
            done < <(sed -nE "s/^[[:space:]]*(import|export)[^'\"]*from[[:space:]]*['\"]([^'\"]+)['\"].*/\2/p; s/^[[:space:]]*import[[:space:]]*['\"]([^'\"]+)['\"].*/\1/p" "$source")
          done < <(find base44 -type f \( -name '*.ts' -o -name '*.tsx' \) -print | sort)

          if [[ -s "$missing_file" ]]; then
            echo 'Missing local source modules:'
            sort -u "$missing_file"
            exit 1
          fi
          echo 'Local import graph complete.'
      - name: Type and import graph check
        run: deno task check
      - name: Lint
        run: deno task lint
      - name: Test
        run: deno task test
